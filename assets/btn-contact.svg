<svg xmlns="http://www.w3.org/2000/svg" width="126.4" height="44" viewBox="0 0 126.4 44" xml:space="preserve"><style>@font-face{font-family:'JBM';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}text{font-family:'JBM',ui-monospace,'SF Mono',Menlo,Consolas,monospace;white-space:pre}.in{animation:in .5s ease-out both}.op{animation:op .25s ease-out both}.blink{animation:blink 1.06s steps(1) infinite}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes op{from{opacity:0}to{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){.in,.op,.blink{animation:none}}</style><defs></defs><rect x="0.5" y="0.5" width="125.4" height="43" rx="4" fill="#0a0a0a" stroke="#2a2a2a"/><text xml:space="preserve" x="63.2" y="27.5" font-size="16" text-anchor="middle"><tspan fill="#8a8a8a" font-weight="400" font-style="normal">./contact</tspan></text></svg>