<svg xmlns="http://www.w3.org/2000/svg" width="840" height="366" viewBox="0 0 840 366" role="img" aria-label="Building with AI: In-app AI assistant (React, SSE); AI avatar presenter (Azure OpenAI, Speech SDK); RAG over documents (LlamaIndex, gpt-oss, Streamlit); Semantic site search (Transformers, ChromaDB, FastAPI); Real-time voice agent (Gemini Live, WebSockets)."><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}.tab{font-variant-numeric:tabular-nums}.pop{animation:pop .4s ease-out backwards}.rise{animation:rise .6s ease-out backwards}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out .2s forwards}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pop{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(4px)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pulse{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.pop,.rise,.pulse{animation:none}.draw{animation:none;stroke-dashoffset:0}}</style><rect x=".5" y=".5" width="839" height="365" rx="12" fill="#ffffff" stroke="#d1d9e0"/><text x="24.0" y="38.0"><tspan fill="#1f2328" font-size="14" font-weight="600">Building with AI</tspan></text><text x="24.0" y="56.0"><tspan fill="#59636e" font-size="12" font-weight="400">LLMs, embeddings and speech in things I've built</tspan></text><g class="rise" style="animation-delay:0.00s"><rect x="24.0" y="70" width="256.0" height="130" rx="8" fill="#f6f8fa"/><text x="40.0" y="98.0"><tspan fill="#1f2328" font-size="14" font-weight="600">In-app AI assistant</tspan></text><text x="40.0" y="116.0" class="mono"><tspan fill="#0550ae" font-size="11" font-weight="400">at CypherSOL</tspan></text><text x="40.0" y="140.0"><tspan fill="#59636e" font-size="12" font-weight="400">Streams answers inside a forensic</tspan></text><text x="40.0" y="156.0"><tspan fill="#59636e" font-size="12" font-weight="400">app, with page context</tspan></text><rect x="40.0" y="168" width="43.0" height="18" rx="9" fill="none" stroke="#d1d9e0"/><text x="45.0" y="181.0" class="mono"><tspan fill="#59636e" font-size="11" font-weight="400">React</tspan></text><rect x="89.0" y="168" width="29.8" height="18" rx="9" fill="none" stroke="#d1d9e0"/><text x="94.0" y="181.0" class="mono"><tspan fill="#59636e" font-size="11" font-weight="400">SSE</tspan></text></g><g class="rise" style="animation-delay:0.06s"><rect x="292.0" y="70" width="256.0" height="130" rx="8" fill="#f6f8fa"/><text x="308.0" y="98.0"><tspan fill="#1f2328" font-size="14" font-weight="600">AI avatar presenter</tspan></text><text x="308.0" y="116.0" class="mono"><tspan fill="#0550ae" font-size="11" font-weight="400">at Bytical</tspan></text><text x="308.0" y="140.0"><tspan fill="#59636e" font-size="12" font-weight="400">Narrates slides and answers audience</tspan></text><text x="308.0" y="156.0"><tspan fill="#59636e" font-size="12" font-weight="400">questions live</tspan></text><rect x="308.0" y="168" width="89.2" height="18" rx="9" fill="none" stroke="#d1d9e0"/><text x="313.0" y="181.0" class="mono"><tspan fill="#59636e" font-size="11" font-weight="400">Azure OpenAI</tspan></text><rect x="403.2" y="168" width="76.0" height="18" rx="9" fill="none" stroke="#d1d9e0"/><text x="408.2" y="181.0" class="mono"><tspan fill="#59636e" font-size="11" font-weight="400">Speech SDK</tspan></text></g><g class="rise" style="animation-delay:0.12s"><rect x="560.0" y="70" width="256.0" height="130" rx="8" fill="#f6f8fa"/><text x="576.0" y="98.0"><tspan fill="#1f2328" font-size="14" font-weight="600">RAG over documents</tspan></text><text x="576.0" y="116.0" class="mono"><tspan fill="#0550ae" font-size="11" font-weight="400">shiv4006/rag-app</tspan></text><text x="576.0" y="140.0"><tspan fill="#59636e" font-size="12" font-weight="400">Ask questions across your own</tspan></text><text x="576.0" y="156.0"><tspan fill="#59636e" font-size="12" font-weight="400">documents</tspan></text><rect x="576.0" y="168" width="76.0" height="18" rx="9" fill="none" stroke="#d1d9e0"/><text x="581.0" y="181.0" class="mono"><tspan fill="#59636e" font-size="11" font-weight="400">LlamaIndex</tspan></text><rect x="658.0" y="168" width="56.2" height="18" rx="9" fill="none" stroke="#d1d9e0"/><text x="663.0" y="181.0" class="mono"><tspan fill="#59636e" font-size="11" font-weight="400">gpt-oss</tspan></text><rect x="720.2" y="168" width="69.4" height="18" rx="9" fill="none" stroke="#d1d9e0"/><text x="725.2" y="181.0" class="mono"><tspan fill="#59636e" font-size="11" font-weight="400">Streamlit</tspan></text></g><g class="rise" style="animation-delay:0.18s"><rect x="24.0" y="212" width="256.0" height="130" rx="8" fill="#f6f8fa"/><text x="40.0" y="240.0"><tspan fill="#1f2328" font-size="14" font-weight="600">Semantic site search</tspan></text><text x="40.0" y="258.0" class="mono"><tspan fill="#0550ae" font-size="11" font-weight="400">shiv4006/smarter-wcs</tspan></text><text x="40.0" y="282.0"><tspan fill="#59636e" font-size="12" font-weight="400">Search any website by meaning, not</tspan></text><text x="40.0" y="298.0"><tspan fill="#59636e" font-size="12" font-weight="400">keywords</tspan></text><rect x="40.0" y="310" width="89.2" height="18" rx="9" fill="none" stroke="#d1d9e0"/><text x="45.0" y="323.0" class="mono"><tspan fill="#59636e" font-size="11" font-weight="400">Transformers</tspan></text><rect x="135.2" y="310" width="62.8" height="18" rx="9" fill="none" stroke="#d1d9e0"/><text x="140.2" y="323.0" class="mono"><tspan fill="#59636e" font-size="11" font-weight="400">ChromaDB</tspan></text><rect x="204.0" y="310" width="56.2" height="18" rx="9" fill="none" stroke="#d1d9e0"/><text x="209.0" y="323.0" class="mono"><tspan fill="#59636e" font-size="11" font-weight="400">FastAPI</tspan></text></g><g class="rise" style="animation-delay:0.24s"><rect x="292.0" y="212" width="256.0" height="130" rx="8" fill="#f6