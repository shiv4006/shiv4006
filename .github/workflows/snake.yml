# Draws the snake that eats my contribution graph in the README. It uses
# GitHub's own calendar colors, so it shows the same graph as my profile, and
# refreshes every 3 hours to keep up with new contributions.
# The SVGs are pushed to the `output` branch.
name: snake

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: update snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
