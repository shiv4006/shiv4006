# Draws the snake that eats my contribution graph in the README, in the same
# grayscale as the rest of the profile. The SVGs are pushed to the `output` branch.
name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f5f5f5&color_dots=#1a1a1a,#3a3a3a,#5c5c5c,#8a8a8a,#c4c4c4
            dist/snake-light.svg?color_snake=#0a0a0a&color_dots=#ebebeb,#c4c4c4,#9a9a9a,#6b6b6b,#3a3a3a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: update snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
