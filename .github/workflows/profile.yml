# Builds the live parts of the profile README from GitHub's contribution
# calendar: the activity cards (scripts/stats.py) and the snake, both in
# GitHub's own calendar colors. Everything is published to the `output` branch.
name: profile

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_dots=#151b23,#033a16,#196c2e,#2ea043,#56d364
            dist/snake-light.svg?palette=github-light&color_dots=#eff2f5,#aceebb,#4ac26b,#2da44e,#116329

      - name: Draw activity cards
        run: python3 scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
          OUT_DIR: dist

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: update profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
